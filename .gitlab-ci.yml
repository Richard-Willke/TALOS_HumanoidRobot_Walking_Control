image: ros:noetic-robot

cache:
  paths:
    - ccache/

before_script:
  - sudo apt install -qqy lsb-release curl
  - sudo mkdir -p /etc/apt/keyrings
  - curl http://robotpkg.openrobots.org/packages/debian/robotpkg.asc | sudo tee /etc/apt/keyrings/robotpkg.asc
  - echo "deb [arch=amd64 signed-by=/etc/apt/keyrings/robotpkg.asc] http://robotpkg.openrobots.org/packages/debian/pub $(lsb_release -cs) robotpkg" | sudo tee /etc/apt/sources.list.d/robotpkg.list
  - sudo apt update
  - sudo apt install -qqy robotpkg-py38-pinocchio
  - sudo apt install -qqy robotpkg-py38-tsid
# Seems that some packages in robot description are not available in rosdep, therefore
# we skip the setup script for now. See problem at catkin lint below.
# Therefore we only setup a running for catkin build command on a machine
#   - git clone https://gitlab.com/VictorLamoine/ros_gitlab_ci.git >/dev/null
#   - source ros_gitlab_ci/gitlab-ci.bash >/dev/null

catkin build:
  stage: build
  script:
    - catkin build --summarize --no-status --force-color
  artifacts:
    paths:
      - 'catkin_workspace/build'
      - 'catkin_workspace/devel'
    expire_in: 4 hrs

