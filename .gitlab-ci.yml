image: ros:noetic-robot

cache:
  paths:
    - ccache/

workflow:
  rules:
    - if: $CI_COMMIT_BRANCH == "develop" || ($CI_PIPELINE_SOURCE == 'merge_request_event' && ( $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "develop" || $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "main" ))

before_script:
  - export LANG=en_US.UTF-8
  - export LANGUAGE=en_US.UTF-8
  - source /opt/ros/noetic/setup.bash
# Seems that some packages in robot description are not available in rosdep, therefore
# we skip the setup script for now. See problem at catkin lint below.
# Therefore we only setup a running for catkin build command on a machine
#   - git clone https://gitlab.com/VictorLamoine/ros_gitlab_ci.git >/dev/null
#   - source ros_gitlab_ci/gitlab-ci.bash >/dev/null

catkin build:
  stage: build
  script:
    - catkin build --summarize --no-status --force-color
  artifacts:
    paths:
      - 'catkin_workspace/build'
      - 'catkin_workspace/devel'
    expire_in: 4 hrs

